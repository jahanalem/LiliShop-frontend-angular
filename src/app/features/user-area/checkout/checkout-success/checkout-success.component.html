<section class="confirmation-container">
  <div class="confirmation-card">
    <h2 class="confirmation-title">Payment status</h2>
    <p class="confirmation-message" role="status" aria-live="polite">{{ message() }}</p>
    <div class="confirmation-buttons">
      <button mat-stroked-button (click)="refresh()">Check again</button>
      @if (checkout()?.orderId; as orderId) {
        <a mat-raised-button color="primary" [routerLink]="['/orders',orderId]">View your order</a>
      } @else {
        <a mat-raised-button color="primary" routerLink="/orders">View your orders</a>
      }
    </div>
  </div>
</section>
